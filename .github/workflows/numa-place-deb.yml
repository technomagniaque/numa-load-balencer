# Construit les paquets de numa-place et les publie en Release GitHub.
#
#   deb    Debian 13         numa-place-common, pve-numa-place, xen-numa-place, kvm-numa-place
#   rpm    Rocky Linux 9     kvm-numa-place (.el9)
#          Rocky Linux 10    kvm-numa-place (.el10)
#          Rocky Linux 9     xcpng-numa-place (.xcpng8.3, compatible rpm 4.11 / XCP-ng 8.3)
#
#   tag numa-place-vX.Y.Z poussé  -> tests, paquets, essais d'installation, Release vX.Y.Z
#   pull request / push sur main   -> idem, sans Release (artefacts seuls)
#   lancement manuel              -> idem, version 0.0.0~ciN
name: numa-place paquets

on:
  push:
    branches: [main]
    tags: ["numa-place-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # création de la Release sur un tag

jobs:
  deb:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Outils Debian 13
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 dpkg-dev lintian

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tests unitaires
        run: python3 -m unittest discover -s tests -v

      - name: Version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#numa-place-v}"
          else version="0.0.0~ci${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Construction des .deb
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            python3 packaging/build_deb.py --version "$VERSION" --out dist

      - name: Contrôle dpkg et lintian
        run: |
          for deb in dist/*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
          lintian --info --no-tag-display-limit dist/*.deb || true

      - name: Essai d'installation et de désinstallation
        run: |
          apt-get install -y ./dist/*.deb
          pve-numa-place --help
          xen-numa-place --help
          kvm-numa-place --help
          test -f /usr/lib/systemd/system/kvm-numa-place.timer
          apt-get purge -y pve-numa-place xen-numa-place kvm-numa-place numa-place-common

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  rpm:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: el9,   image: "rockylinux/rockylinux:9",  target: el,    test: true }
          - { label: el10,  image: "rockylinux/rockylinux:10", target: el,    test: true }
          - { label: xcpng, image: "rockylinux/rockylinux:9",  target: xcpng, test: false }
    container: ${{ matrix.image }}
    steps:
      - name: Outils rpm
        run: dnf install -y rpm-build python3 git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#numa-place-v}"
          else version="0.0.0~ci${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Construction du RPM (${{ matrix.label }})
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            python3 packaging/build_rpm.py --target ${{ matrix.target }} --version "$VERSION" --out dist
          for r in dist/*.rpm; do
            rpm -qpi "$r"; rpm -qpl "$r"; rpm -qp --requires "$r"
            echo "charge : $(rpm -qp --qf '%{PAYLOADCOMPRESSOR}' "$r")"
          done

      - name: Essai d'installation et de désinstallation (dnf)
        if: matrix.test
        run: |
          dnf install -y ./dist/*.rpm
          kvm-numa-place --help
          test -f /usr/lib/systemd/system/kvm-numa-place.timer
          dnf remove -y kvm-numa-place

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.label }}
          path: dist/*.rpm

  release:
    if: github.ref_type == 'tag'
    needs: [deb, rpm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Sommes de contrôle
        run: |
          echo "VERSION=${GITHUB_REF_NAME#numa-place-v}" >> "$GITHUB_ENV"
          cd dist && sha256sum *.deb *.rpm > SHA256SUMS && cat SHA256SUMS

      - name: Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: numa-place ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
